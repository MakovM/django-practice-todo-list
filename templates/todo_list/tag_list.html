{% extends "base.html" %}

{% block content %}
  <h1>
    Tags List
    <a href="{% url 'todo-list:tag-create' %}" class="btn btn-warning task-btn">Add tag</a>
  </h1>
  <hr>
  {% if tag_list %}
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    {% for tag in tag_list %}
      <tr>
        <td>{{ tag.name }}</td>
        <td>
          <a href="{% url 'todo-list:tag-update' pk=tag.id %}" class="btn btn-dark">✏️ Update</a>
        </td>
        <td>
          <a href="{% url 'todo-list:tag-delete' pk=tag.id %}" class="btn btn-danger">🗑 Delete</a>
        </td>
      </tr>
    {% endfor %}
    </table>
  {% else %}
    <p>There are no tags.</p>
  {% endif %}
{% endblock %}
